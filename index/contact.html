<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - PULSE</title>
  <link rel="stylesheet" href="../styles/register.css">
  <link rel="stylesheet" href="/index/nav.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="register-main">
    <section class="register-card" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact us</h1>
      <p class="register-intro">Have a question or feedback? We'll get back to you.</p>

      <form id="contact-form" novalidate>

        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <span class="error" id="err-name"></span>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <span class="error" id="err-email"></span>

        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="" selected disabled>Choose a subject</option>
          <option value="Events">Events</option>
          <option value="Clubs">Clubs</option>
          <option value="Technical issue">Technical issue</option>
          <option value="Other">Other</option>
        </select>
        <span class="error" id="err-subject"></span>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" maxlength="500"></textarea>
        <small id="char-count">0 / 500</small>
        <span class="error" id="err-message"></span>

        <button id="submit-btn" type="submit">Send message</button>

      </form>

      <div id="confirmation" hidden></div>

    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/index/contact.js"></script>
  <script src="/index/nav.js"></script>
</body>
</html>
