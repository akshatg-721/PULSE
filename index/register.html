<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register for an event - PULSE</title>
  <link rel="stylesheet" href="../styles/register.css">
  <link rel="stylesheet" href="/index/nav.css">
</head>
<body>
  <header id="site-nav"></header>

  <main class="register-main">
    <section class="register-card" aria-labelledby="register-title">
      <h1 id="register-title">Register for an event</h1>
      <p class="register-intro">Enter your details to save your place.</p>

      <form id="register-form" novalidate>

        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <span class="error" id="err-name"></span>

        <label for="email">College email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <span class="error" id="err-email"></span>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="10">
        <span class="error" id="err-phone"></span>

        <label for="course">Course</label>
        <input id="course" name="course" type="text" autocomplete="off">
        <span class="error" id="err-course"></span>

        <label for="year">Year</label>
        <select id="year" name="year">
          <option value="" selected disabled>Select your year</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <span class="error" id="err-year"></span>

        <label for="enrollment">Enrollment number</label>
        <input id="enrollment" name="enrollment" type="text" autocomplete="off">
        <span class="error" id="err-enrollment"></span>

        <label for="eventName">Event</label>
        <select id="eventName" name="eventName">
          <option value="" selected disabled>Choose an event</option>
        </select>
        <span class="error" id="err-eventName"></span>

        <div class="agree-row">
          <input id="agree" name="agree" type="checkbox">
          <label for="agree" class="agree-label">I agree to the event rules</label>
        </div>
        <span class="error" id="err-agree"></span>

        <button id="submit-btn" type="submit">Complete registration</button>

      </form>

      <div id="confirmation" hidden></div>

    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/index/register.js"></script>
  <script src="/index/nav.js"></script>
</body>
</html>
