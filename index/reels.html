<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels - PULSE</title>
  <link rel="stylesheet" href="../styles/reels.css">
  <link rel="stylesheet" href="/index/nav.css">
</head>
<body>
  <header id="site-nav"></header>

  <main>
    <h1>Campus Reels</h1>
    <div class="reel-frame">
      <iframe
        id="reel"
        title="Instagram reel 1"
        src="https://www.instagram.com/reel/De9csE3C7Y-/embed"
        allowfullscreen>
      </iframe>
    </div>
    <p id="reel-count" aria-live="polite">Reel 1 of 2</p>
    <div class="reel-buttons">
      <button id="previous" type="button" disabled>Previous</button>
      <button id="next" type="button">Next</button>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/index/reels.js"></script>
  <script src="/index/nav.js"></script>
</body>
</html>
