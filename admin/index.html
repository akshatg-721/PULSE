<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE Admin</title>
  <link rel="stylesheet" href="/index/nav.css">
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <header id="site-nav"></header>
  <main class="admin-page">
    <header class="admin-heading">
      <p class="eyebrow">PULSE CONTROL CENTER</p>
      <h1>Event administration</h1>
      <p>Create and manage events, and record or review attendance.</p>
    </header>

    <section class="admin-section" aria-labelledby="event-form-title">
      <h2 id="event-form-title">Create an event</h2>
      <form id="event-form" class="admin-form">
        <input type="hidden" name="slug">
        <label>Event title<input name="title" required maxlength="120"></label>
        <label>Category<input name="category" required maxlength="50"></label>
        <label>Date<input name="date" type="date" required></label>
        <label>Time<input name="time" required maxlength="40"></label>
        <label>Venue<input name="venue" required maxlength="120"></label>
        <label>Club<input name="club" required maxlength="100"></label>
        <label class="wide">Description (optional)<textarea name="description" rows="3" maxlength="2000"></textarea></label>
        <div class="wide admin-actions">
          <button type="submit" id="event-save">Create event</button>
          <button type="button" class="button-secondary" id="event-cancel" hidden>Cancel edit</button>
        </div>
      </form>
      <p id="event-message" class="admin-message" role="status"></p>
    </section>

    <section class="admin-section" aria-labelledby="events-title">
      <h2 id="events-title">Events</h2>
      <div id="event-list" class="event-list"></div>
    </section>

    <section class="admin-section" aria-labelledby="attendance-title">
      <h2 id="attendance-title">Mark attendance</h2>
      <form id="attendance-form" class="admin-form attendance-form">
        <label>Event<select name="eventSlug" required></select></label>
        <label>Enrollment number<input name="enrollment" required autocomplete="off"></label>
        <div class="wide admin-actions"><button type="submit">Mark present</button></div>
      </form>
      <p id="mark-message" class="admin-message" role="status"></p>
    </section>

    <section class="admin-section" aria-labelledby="attendance-records-title">
      <h2 id="attendance-records-title">Attendance records</h2>
      <form id="attendance-filter" class="filter-form">
        <label>Filter by event<select name="event"><option value="">All events</option></select></label>
        <label>Filter by club<select name="club"><option value="">All clubs</option></select></label>
        <button type="submit">Apply filters</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Event</th><th>Club</th><th>Name</th><th>Email</th><th>Enrollment</th><th>Attended at</th></tr>
          </thead>
          <tbody id="attendance-list"></tbody>
        </table>
      </div>
      <p id="attendance-message" class="admin-message" role="status"></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/index/nav.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
